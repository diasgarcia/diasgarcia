# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
# Adaptado de nihiL7331/nihiL7331 para diasgarcia/diasgarcia
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main", "mult-info"]}
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: diasgarcia
          template: classic
          base: header, activity,  repositories, metadata
          config_timezone: America/Sao_Paulo
          # plugin_activity desativado: lowlighter/metrics v3.34 quebra com
          # "Unexpected error" (TypeError no PushEvent sem commits no payload,
          # bug upstream ainda presente no master). Stats de activity do base continuam.
          plugin_activity: no
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_habits: false
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_ignored: lua, html, css
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_notable: yes
          plugin_people: no
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following
